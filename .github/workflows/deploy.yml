name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vs-profile-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run build
        env:
          SITE_URL: https://vs-profile.ru
      - run: npm run typecheck

  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main' }}
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_FINGERPRINT: ${{ secrets.VPS_HOST_FINGERPRINT }}
        run: |
          for value in VPS_HOST VPS_USER VPS_SSH_KEY VPS_HOST_FINGERPRINT; do
            if [ -z "${!value}" ]; then
              echo "Missing required secret: $value" >&2
              exit 1
            fi
          done

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.2
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: DEPLOY_SHA
          command_timeout: 20m
          script: |
            set -eu
            cd /var/www/landing-page-presentation
            git fetch origin main
            git reset --hard "$DEPLOY_SHA"
            npm ci --include=dev --prefer-offline --no-audit
            SITE_URL=https://vs-profile.ru npm run build
            sudo -n systemctl restart vs-profile
            systemctl is-active --quiet vs-profile
            for attempt in 1 2 3 4 5; do
              if curl --fail --silent --show-error --max-time 5 --output /dev/null http://127.0.0.1:3100/; then
                echo "Website is responding."
                exit 0
              fi
              sleep 2
            done
            echo "Website did not respond after restart." >&2
            exit 1
